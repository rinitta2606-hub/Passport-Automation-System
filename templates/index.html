<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passport Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Passport Management System</h1>

        <p>Select your role to continue</p>

        <div class="role-buttons">
            <button onclick="showLogin('applicant')">Applicant</button>
            <button onclick="showLogin('admin')">Administrator</button>
            <button onclick="showLogin('police')">Police Officer</button>
        </div>

        <!-- Login / Registration -->
        <div id="login-section"></div>

        <!-- Dashboards -->
        <div id="main-section"></div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
